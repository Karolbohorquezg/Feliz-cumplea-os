<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una carta para Sebastián ♡</title>

    <!-- Conectamos nuestro diseño -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- PANTALLA DEL SOBRE -->
    <!-- ========================= -->

    <main class="scene" id="scene">

        <div class="envelope-container" id="envelopeContainer">

            <div class="envelope" id="envelope">

                <!-- Solapa del sobre -->
                <div class="flap"></div>

                <!-- Parte delantera -->
                <div class="envelope-front"></div>

                <!-- Nombre -->
                <div class="address">

                    <span>Una carta para</span>

                    <h1>Sebastián</h1>

                </div>

                <!-- Sello -->
                <div class="seal">
                    ♡
                </div>

            </div>

            <!-- Texto debajo del sobre -->
            <p class="open-text">
                Haz clic para abrir la carta
            </p>

        </div>


        <!-- ========================= -->
        <!-- CARTA -->
        <!-- ========================= -->

        <article class="letter" id="letter">

            <div class="letter-border">

                <div class="ornament">
                    ✦ · · · ✦
                </div>

                <h2>Sebastián</h2>

                <p class="letter-date">
                    18 años · con cariño
                </p>


                <!-- Aquí aparecerá el mensaje -->
                <div class="message" id="message"></div>


                <!-- Firma -->
                <div class="signature" id="signature">

                    Con todo mi cariño,<br>

                    <span>Daniela</span>

                </div>


                <!-- Frase final -->
                <div class="postscript" id="postscript">

                    y si alguna vez vuelves a pensar en nosotros,
                    espero que recuerdes lo mucho que te quiero.

                </div>

            </div>

        </article>

    </main>


    <!-- Nuestro código de funcionamiento -->
    <script src="script.js"></script>

</body>

</html>
